<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030712">
  <meta name="description" content="Órbita: tu casa, tu plata, tu entrenamiento y tus proyectos en un solo lugar.">
  <title>Órbita</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/orbita.css">
</head>
<body>
  <!-- Pantalla de entrada -->
  <section id="login" class="login" hidden>
    <div class="login-card">
      <div class="logo-grande" aria-hidden="true"></div>
      <h1>Órbita</h1>
      <p>Tu casa, tu plata, tu entrenamiento y tus proyectos, girando en un solo lugar.</p>
      <div id="google-btn"></div>
      <p id="login-error" class="login-error" role="alert"></p>
    </div>
  </section>

  <!-- App -->
  <div id="app" class="app" hidden>
    <header class="top">
      <a class="marca" href="#hoy" aria-label="Órbita, ir a Hoy">
        <span class="logo" aria-hidden="true"></span>
        <span>Órbita</span>
      </a>
      <div class="top-der">
        <span id="sync" class="sync" title="Estado de conexión"></span>
        <button id="refrescar" class="icono" aria-label="Actualizar">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <main id="vista" class="vista" tabindex="-1"></main>

    <nav id="nav" class="nav" aria-label="Secciones"></nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="dialogo" class="dialogo"></dialog>

  <script src="js/config.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
